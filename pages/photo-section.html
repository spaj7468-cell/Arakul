<section class="page" id="page-photo">
  <div class="head"><div><div class="eyebrow">11 / Photo lab</div><h1>Фото-редактор</h1><p>Настрой свет, цвет и резкость, кадрируй, поворачивай, добавляй подписи и экспортируй изображение в полном разрешении.</p></div><div class="head-actions"><label class="btn primary">＋ Открыть фото<input id="photoFile" type="file" accept="image/*" hidden></label><button class="btn" id="photoUndo" disabled>↶ Отменить</button><button class="btn" id="photoExport">Экспорт ↓</button></div></div>
  <div class="photo-workspace">
    <aside class="panel photo-tools">
      <div class="panelhead"><h3>Коррекция</h3><button class="btn small" id="photoReset">Сброс</button></div>
      <div class="field"><label for="photoBrightness">Яркость <b id="photoBrightnessVal">100%</b></label><input id="photoBrightness" type="range" min="0" max="200" value="100"></div>
      <div class="field"><label for="photoContrast">Контраст <b id="photoContrastVal">100%</b></label><input id="photoContrast" type="range" min="0" max="200" value="100"></div>
      <div class="field"><label for="photoSaturation">Насыщенность <b id="photoSaturationVal">100%</b></label><input id="photoSaturation" type="range" min="0" max="200" value="100"></div>
      <div class="field"><label for="photoBlur">Мягкость <b id="photoBlurVal">0 px</b></label><input id="photoBlur" type="range" min="0" max="8" value="0" step=".5"></div>
      <div class="field"><label for="photoPreset">Образ</label><select class="select" id="photoPreset"><option value="none">Оригинал</option><option value="mono">Чёрно-белый</option><option value="warm">Тёплый</option><option value="cool">Холодный</option><option value="vintage">Винтаж</option></select></div>
      <div class="panelhead photo-subhead"><h3>Трансформация</h3></div>
      <div class="row"><button class="btn" id="photoRotateLeft">↶ 90°</button><button class="btn" id="photoRotateRight">↷ 90°</button></div>
      <div class="row"><button class="btn" id="photoFlipH">↔ Отразить</button><button class="btn" id="photoCrop">Кадрировать</button></div>
      <div class="field"><label for="photoCropRatio">Пропорции кадра</label><select class="select" id="photoCropRatio"><option value="free">Свободно / центр</option><option value="1:1">1:1 квадрат</option><option value="4:3">4:3</option><option value="16:9">16:9</option><option value="9:16">9:16</option></select></div>
      <div class="field"><label for="photoFormat">Формат экспорта</label><select class="select" id="photoFormat"><option value="image/png">PNG · без потерь</option><option value="image/jpeg">JPEG · компактный</option><option value="image/webp">WebP · современный</option></select></div>
    </aside>
    <div class="panel photo-canvas-panel"><div class="panelhead"><h3 id="photoName">Рабочий холст</h3><span class="tiny" id="photoDimensions">Файл не выбран</span></div>
      <div class="photo-stage"><canvas id="photoCanvas" width="1200" height="800" aria-label="Фото на холсте"></canvas><div class="photo-empty" id="photoEmpty"><span>▧</span><strong>Твоя фотолаборатория</strong><small>Фото не загружаются на сервер — всё обрабатывается на устройстве</small></div></div>
      <div class="photo-bottom"><div class="field"><label for="photoCaption">Текст на фото</label><input class="input" id="photoCaption" placeholder="Подпись или заголовок…"></div><button class="btn" id="photoAddCaption">Добавить текст</button></div>
    </div>
  </div>
</section>
